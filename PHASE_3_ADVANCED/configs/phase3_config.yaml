# ============================================================================
# PHASE 3: ADVANCED LEARNING TECHNIQUES
# ============================================================================
# Target: F1 = 0.94-0.96 (+2-4% cumulative)
# Duration: Weeks 5-9 (can parallelize tasks)
# GPU Memory: 10-16 GB (particularly for SimCLR pretraining)
# ============================================================================

# ============================================================================
# PHASE 3A: Self-Supervised Pretraining (SimCLR)
# ============================================================================
simclr_pretraining:
  enabled: true
  backbone: "resnet50"
  hidden_dim: 2048
  out_dim: 128
  
  training:
    epochs: 100
    batch_size: 64  # Larger batch for contrastive learning
    learning_rate: 0.003
    weight_decay: 1e-4
    optimizer: "Adam"
    temperature: 0.07
    
    # Training on ALL images (no labels needed)
    use_all_images: true  # Includes IR images
    
  # Augmentation for SimCLR (different from supervised)
  augmentation:
    random_crop_and_resize:
      p: 1.0
      scale: [0.08, 1.0]
    
    color_jitter:
      brightness: 0.8
      contrast: 0.8
      saturation: 0.8
      hue: 0.2
      p: 0.8
    
    random_grayscale:
      p: 0.2
    
    gaussian_blur:
      kernel_size: 23
      sigma: [0.1, 2.0]
      p: 0.5
  
  # Transfer to segmentation
  transfer:
    freeze_encoder_epochs: 10  # Train only head first
    unfreeze_backbone_epochs: 40  # Then fine-tune everything
    learning_rate_finetune: 0.00001

  logging:
    log_dir: "PHASE_3_ADVANCED/results/simclr"
    save_pretrained_encoder: true

# ============================================================================
# PHASE 3B: Domain Adversarial Training
# ============================================================================
domain_adversarial:
  enabled: true
  
  # Main segmentation model (from Phase 2)
  segmentation_backbone: "segformer-b3"
  
  # Domain discriminator setup
  domain_discriminator:
    hidden_dim: 256
    num_classes: 2  # has_placido_rings (0) or no_rings (1)
  
  training:
    epochs: 50
    batch_size: 4
    learning_rate_seg: 0.00001
    learning_rate_disc: 0.0001
    weight_decay: 1e-4
    
    # Adversarial loss weight
    lambda_adversarial: 0.1  # Weight of domain adaptation loss
    
    optimizer_seg: "AdamW"
    optimizer_disc: "Adam"
  
  # Domain data preparation
  domain_data:
    # Create synthetic "no-ring" variants by masking
    create_masked_variants: true
    mask_radius: 200  # Pixels to mask around center (Placido rings)
    
    # Augmentation to simulate domain shift
    ring_removal_method: "gaussian_interpolation"  # or "random_noise"
  
  # Evaluation
  eval_on_masked_test:
    enabled: true
    description: "Test robustness on masked/ring-removed images"
  
  logging:
    log_dir: "PHASE_3_ADVANCED/results/domain_adversarial"
    save_best_model: true

# ============================================================================
# PHASE 3C: Ensemble Methods
# ============================================================================
ensemble:
  enabled: true
  
  # Build ensemble from trained models
  ensemble_models:
    - model_id: "segformer_b3_seed0"
      checkpoint: "PHASE_2_TRANSFORMERS/models/segformer_b3_seed0_best.pth"
    - model_id: "segformer_b3_seed1"
      checkpoint: "PHASE_2_TRANSFORMERS/models/segformer_b3_seed1_best.pth"
    - model_id: "segformer_b3_seed2"
      checkpoint: "PHASE_2_TRANSFORMERS/models/segformer_b3_seed2_best.pth"
    - model_id: "segformer_b5_seed0"
      checkpoint: "PHASE_2_TRANSFORMERS/models/segformer_b5_seed0_best.pth"
  
  # Ensemble strategy
  aggregation: "average"  # Options: "average", "voting", "weighted"
  
  # For weighted ensemble
  model_weights: null  # Auto-weight by validation F1
  
  # Uncertainty estimation
  compute_uncertainty: true
  uncertainty_method: "predictive_variance"  # or "entropy", "margin"

# ============================================================================
# GENERAL PHASE 3 CONFIGURATION
# ============================================================================

# Data Configuration (reuse from Phase 2)
data:
  dataset_path: "data/processed"
  image_format: "png"
  input_height: 512
  input_width: 512
  
  splits:
    train: 0.70
    val: 0.15
    test: 0.15
  
  num_workers: 4
  pin_memory: true

# Device Configuration
device:
  gpu: 0
  num_gpus: 1
  precision: "16-mixed"

# Reproducibility
seed: 42
deterministic: true

# Logging & Monitoring
logging:
  base_log_dir: "PHASE_3_ADVANCED/results"
  save_interval: 5
  tensorboard_enabled: true
  wandb_enabled: true
  wandb_project: "tear-meniscus-phase3"
  
  metrics:
    - "f1"
    - "recall"
    - "precision"
    - "miou"
    - "dice"
    - "domain_loss"  # For domain adversarial
    - "uncertainty"  # For ensemble

# Phase Information
phase:
  name: "Phase 3 - Advanced Learning"
  target_f1: 0.96
  expected_improvement: "+2-4% (cumulative)"
  
  sub_phases:
    3a: "Self-Supervised Pretraining (SimCLR)"
    3b: "Domain Adversarial Training"
    3c: "Ensemble Methods"
  
  key_techniques:
    - "Self-supervised learning (SimCLR) on unlabeled IR images"
    - "Domain-invariant representations for ring robustness"
    - "Ensemble averaging for improved stability"
    - "Uncertainty estimation for confidence scoring"
    - "Multi-task learning and adversarial training"

# Timeline (flexible, can parallelize)
timeline:
  week_5: "3A - SimCLR pretraining (7-10 days)"
  week_6: "3A - Transfer learning + 3B - Domain adversarial setup"
  week_7: "3B - Domain adversarial training"
  week_8: "3C - Ensemble training (parallel with 3B)"
  week_9: "Ablation studies, final evaluation, documentation"
